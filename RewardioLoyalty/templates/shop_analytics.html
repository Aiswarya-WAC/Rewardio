<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Customer Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .controls {
            margin-bottom: 20px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .controls input {
            padding: 8px;
            margin: 0 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .controls button {
            padding: 8px 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .controls button:hover {
            background-color: #2980b9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
        }

        .large-chart {
            width: 450px !important;  /* Increased from 350px */
            height: 450px !important; /* Increased from 350px */
            margin: 0 auto 20px auto; /* Center it and add spacing */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f1f1f1;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .controls {
                text-align: center;
            }
            .controls input {
                margin: 5px 0;
                width: 100%;
            }
            table {
                font-size: 14px;
            }
            .large-chart {
                width: 400px !important; /* Increased from 300px */
                height: 400px !important;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h1>Shop Customer Analytics</h1>
            <p>Date: April 10, 2025</p>
        </div>

        <div class="controls">
            <input type="text" id="accessToken" placeholder="Enter Access Token (Required)">
            <input type="text" id="shopId" placeholder="Enter Shop ID (Required)">
            <input type="date" id="startDate">
            <input type="date" id="endDate">
            <button onclick="loadData()">Load Data</button>
        </div>

        <div class="card">
            <h2 id="shopName">Shop Overview</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="total-customers">0</div>
                    <div class="stat-label">Total Customers</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="total-points">0</div>
                    <div class="stat-label">Total Points</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="purchase-calls">0</div>
                    <div class="stat-label">Purchase API Calls</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="reward-calls">0</div>
                    <div class="stat-label">Direct Reward Calls</div>
                </div>
            </div>
            <canvas id="pointsChart" class="large-chart"></canvas>

            <h3>Customer Details</h3>
            <table id="customerTable">
                <thead>
                    <tr>
                        <th>Customer ID</th>
                        <th>Tier</th>
                        <th>Points</th>
                        <th>Purchase Calls</th>
                        <th>Reward Calls</th>
                        <th>Purchase Points</th>
                        <th>Direct Points</th>
                        <th>Total Points</th>
                        <th>Redeemed Transactions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Customer data will be populated here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Register the datalabels plugin
        Chart.register(ChartDataLabels);

        let pointsChart;

        async function loadData() {
            const accessToken = document.getElementById('accessToken').value;
            const shopId = document.getElementById('shopId').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (!accessToken) {
                alert('Please enter an Access Token');
                return;
            }
            if (!shopId) {
                alert('Please enter a Shop ID');
                return;
            }

            let url = `/shop-customer-analytics/?shop_id=${shopId}`;
            if (startDate) url += `&start_date=${startDate}`;
            if (endDate) url += `&end_date=${endDate}`;

            try {
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });
                const data = await response.json();

                if (response.ok) {
                    updateDashboard(data);
                } else {
                    alert(data.error || 'Error loading data');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load data');
            }
        }

        function updateDashboard(data) {
            // Update shop-level stats
            document.getElementById('shopName').textContent = `${data.shop_name} Overview`;
            document.getElementById('total-customers').textContent = data.total_customers;
            document.getElementById('total-points').textContent = data.grand_total_points;
            document.getElementById('purchase-calls').textContent = data.total_purchase_api_calls;
            document.getElementById('reward-calls').textContent = data.total_direct_reward_api_calls;

            // Update pie chart with data labels
            if (pointsChart) pointsChart.destroy();
            pointsChart = new Chart(document.getElementById('pointsChart'), {
                type: 'pie',
                data: {
                    labels: ['Purchase Points', 'Direct Reward Points'],
                    datasets: [{
                        data: [data.total_purchase_points, data.total_direct_reward_points],
                        backgroundColor: ['#3498db', '#2ecc71']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'top' },
                        title: { display: true, text: 'Points Distribution' },
                        datalabels: {
                            color: '#fff', // White text for contrast
                            font: {
                                weight: 'bold',
                                size: 16 // Slightly larger font for visibility
                            },
                            formatter: (value, context) => {
                                return value > 0 ? value : ''; // Show value only if > 0
                            }
                        }
                    }
                }
            });

            // Update customer table
            const tbody = document.querySelector('#customerTable tbody');
            tbody.innerHTML = '';  // Clear existing rows
            data.customers.forEach(customer => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${customer.customer_id}</td>
                    <td>${customer.tier?.tier?.name || 'N/A'}</td>
                    <td>${customer.points}</td>
                    <td>${customer.purchase_api_calls}</td>
                    <td>${customer.direct_reward_api_calls}</td>
                    <td>${customer.total_purchase_points}</td>
                    <td>${customer.total_direct_reward_points}</td>
                    <td>${customer.grand_total_points}</td>
                    <td>${customer.reward_management.total_redeemed_transactions}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // Initial empty chart with data labels
        pointsChart = new Chart(document.getElementById('pointsChart'), {
            type: 'pie',
            data: {
                labels: ['Purchase Points', 'Direct Reward Points'],
                datasets: [{
                    data: [0, 0],
                    backgroundColor: ['#3498db', '#2ecc71']
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'top' },
                    title: { display: true, text: 'Points Distribution' },
                    datalabels: {
                        color: '#fff',
                        font: {
                            weight: 'bold',
                            size: 16
                        },
                        formatter: (value, context) => {
                            return value > 0 ? value : '';
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
