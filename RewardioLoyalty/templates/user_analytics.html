<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Rewards Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .controls {
            margin-bottom: 20px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .controls input {
            padding: 8px;
            margin: 0 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .controls button {
            padding: 8px 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .controls button:hover {
            background-color: #2980b9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
        }

        canvas {
            max-width: 100%;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .controls {
                text-align: center;
            }
            .controls input {
                margin: 5px 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h1>User Rewards Analytics</h1>
            <p id="currentDate"></p>
        </div>

        <!-- User Analytics Controls -->
        <div class="controls">
            <h3>User Analytics</h3>
            <input type="text" id="accessToken" placeholder="Enter Access Token (Required)">
            <input type="text" id="customerId" placeholder="Enter Customer ID (Required)">
            <input type="text" id="shopId" placeholder="Enter Shop ID (Optional)">
            <input type="date" id="startDate">
            <input type="date" id="endDate">
            <button onclick="loadUserData()">Load User Data</button>
        </div>

        <!-- User Analytics Card -->
        <div class="card">
            <h2 id="userTitle">User Activity (Customer ID: N/A)</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="user-total-points">0</div>
                    <div class="stat-label">Total Points</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="user-redeemed-points">0</div>
                    <div class="stat-label">Redeemed Points</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="user-purchase-points">0</div>
                    <div class="stat-label">Purchase Points</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="user-direct-points">0</div>
                    <div class="stat-label">Direct Reward Points</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="user-tier">N/A</div>
                    <div class="stat-label">Tier</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="user-purchase-calls">0</div>
                    <div class="stat-label">Purchase API Calls</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="user-reward-calls">0</div>
                    <div class="stat-label">Direct Reward Calls</div>
                </div>
            </div>
            <canvas id="userActivityChart"></canvas>
        </div>
    </div>

    <script>
        let userActivityChart;

        // Set current date dynamically
        document.getElementById('currentDate').textContent = `Date: ${new Date().toLocaleDateString(undefined, {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        })}`;

        // User Data Loading
        async function loadUserData() {
            const accessToken = document.getElementById('accessToken').value;
            const customerId = document.getElementById('customerId').value;
            const shopId = document.getElementById('shopId').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (!accessToken) {
                alert('Please enter an Access Token');
                return;
            }
            if (!customerId) {
                alert('Please enter a Customer ID');
                return;
            }

            let url = `/user-analytics/?customer_id=${customerId}`;
            if (shopId) url += `&shop_id=${shopId}`;
            if (startDate) url += `&start_date=${startDate}`;
            if (endDate) url += `&end_date=${endDate}`;

            try {
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });
                const data = await response.json();

                if (response.ok) {
                    updateUserDashboard(data);
                } else {
                    alert(data.error || 'Error loading user data');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load user data');
            }
        }

        function updateUserDashboard(data) {
            document.getElementById('userTitle').textContent = `User Activity (Customer ID: ${data.customer_id})`;
            const shopData = data.shops[0] || {};

            document.getElementById('user-total-points').textContent = shopData.total_points || 0;
            document.getElementById('user-redeemed-points').textContent = shopData.redeemed_points || 0;
            document.getElementById('user-purchase-points').textContent = shopData.purchase_points || 0;
            document.getElementById('user-direct-points').textContent = shopData.direct_reward_points || 0;
            document.getElementById('user-tier').textContent = shopData.tier?.tier?.name || 'N/A';
            document.getElementById('user-purchase-calls').textContent = shopData.purchase_api_calls || 0;
            document.getElementById('user-reward-calls').textContent = shopData.direct_reward_api_calls || 0;

            if (userActivityChart) userActivityChart.destroy();
            userActivityChart = new Chart(document.getElementById('userActivityChart'), {
                type: 'bar',
                data: {
                    labels: ['Purchase Points', 'Direct Rewards', 'Redeemed Points'],
                    datasets: [{
                        label: 'Points',
                        data: [
                            shopData.purchase_points || 0,
                            shopData.direct_reward_points || 0,
                            shopData.redeemed_points || 0
                        ],
                        backgroundColor: ['#3498db', '#2ecc71', '#e74c3c']
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' },
                        title: { display: true, text: 'Points Activity' }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        // Initial empty chart
        userActivityChart = new Chart(document.getElementById('userActivityChart'), {
            type: 'bar',
            data: {
                labels: ['Purchase Points', 'Direct Rewards', 'Redeemed Points'],
                datasets: [{
                    label: 'Points',
                    data: [0, 0, 0],
                    backgroundColor: ['#3498db', '#2ecc71', '#e74c3c']
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'top' },
                    title: { display: true, text: 'Points Activity' }
                },
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });
    </script>
</body>
</html>
